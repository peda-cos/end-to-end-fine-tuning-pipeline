[project]
name = "ftpipe"
version = "0.1.0"
description = "End-to-end fine-tuning pipeline: data hygiene, SFT, DPO/GRPO, quantization, speculative serving, eval, and MOF model card."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Pedro Monteiro" }]
dependencies = [
  "numpy==2.5.5",
  "PyYAML==6.0.3",
]

[dependency-groups]
dev = [
  "pytest>=9.0,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ftpipe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
